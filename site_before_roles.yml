---

- hosts: all
  become: true
  pre_tasks:

  - name: update repo cache (Amazon Linux)
    tags: always
    yum:
      update_cache: yes
    changed_when: false
    when: ansible_distribution == "Amazon"


  - name: update repo cache (Ubuntu)
    tags: always
    apt:
      update_cache: yes
    changed_when: false
    when: ansible_distribution in ["Ubuntu", "Debian"]


- hosts: all
  become: true
  tasks:
  - name: add ssh key for simone
    tags: always
    authorized_key: 
      user: simone
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBcqT6E3kxcBaq/toP2CdDZY8VMh91e+F7E0lJssmjSt ansible" 


- hosts: workstations
  become: true
  tasks:

    - name: install unzip
      package:
        name: unzip
    
    - name: install terraform
      unarchive:
        src: https://releases.hashicorp.com/terraform/1.14.1/terraform_1.14.1_linux_amd64.zip
        dest: /usr/local/bin
        remote_src: yes
        mode: 0755
        owner: root
        group: root


- hosts: web_servers
  become: true
  tasks:

  - name: install apache2 and php packages
    tags: apache,apache2,debian
    apt:
      name:
        - apache2
        - libapache2-mod-php
      state: latest
    when: ansible_distribution == "Debian"
    

  - name: copy default html file for site
    tags: apache,apache2,httpd
    copy: 
      src: defaults_site.html
      dest: /var/www/html/index.html
      owner: root
      group: root
      mode: 0644

  - name: start httpd (Debian)
    tags: apache,debian,httpd
    service: 
      name: apache2
      state: started
      enabled: yes
    when: ansible_distribution == "Debian"

  - name: change email address for admin
    tags: apache,debian,httpd
    lineinfile: 
      path: /etc/apache2/sites-available/000-default.conf
      regexp: '^\s*ServerAdmin'
      line: ServerAdmin somebody@somewhere.net
    when: ansible_distribution == "Debian"
    register: apache2



  - name: restart apache2 (Debian)
    tags: apache,debian,httpd
    service:
      name: apache2
      state: restarted
    when: apache2.changed


  - name: Install httpd, php and nginx on Amazon EC2
    tags: apache,amazon,php
    yum:
      name:
        - nginx
        - httpd
        - php
      state: latest
    when: ansible_distribution == "Amazon"

- hosts: db_servers
  become: true
  tasks:

  - name: install mariadb package (Ubuntu)
    tags: centos,db,mariadb
    apt:
      name: mariadb-server
      state: latest
    when: ansible_distribution in ["Ubuntu", "Debian"]


  - name: install mariadb package (Amazon)
    tags: db,mariadb,ubuntu
    yum:
      name: mariadb
      state: latest
    when: ansible_distribution == "Amazon"

- hosts: file_servers
  become: true
  tasks:

  - name: install samba package
    tags: samba
    package:
      name: samba
      state: latest


