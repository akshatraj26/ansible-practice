---

- hosts: all
  become: true
  tasks:


  - name: update repository index
    apt:
       update_cache: yes

  - name: remove apache2 and php packages
    apt:
       name:
         - apache2
         - libapache2-mod-php
       state: absent

  - name: remove nginx packages
    apt:
      name:
        - nginx
      state: absent

